{% extends 'base.html' %}
{% block title %}Members Directory{% endblock %}

{% block extra_css %}
<!-- Styles centralized in main.css -->
{% endblock %}

{% block content %}
<div class="odoo-control-panel">
  <div class="odoo-breadcrumb">
    <h2>Members</h2>
  </div>

  <div class="odoo-search-container">
    <i data-lucide="search" class="odoo-search-icon" style="width: 16px; height: 16px;"></i>
    <input type="text" id="search-input" class="odoo-search-bar" placeholder="Search by name, phone, or ID..." onkeyup="if(event.key === 'Enter') loadData()">
    <button class="odoo-search-dropdown-btn" onclick="toggleFilterPanel()" title="Advanced Filters">
      <i data-lucide="sliders-horizontal" style="width: 16px; height: 16px;"></i>
    </button>

    <div class="odoo-filter-panel" id="filter-panel">
      <div class="filter-grid">
        <div class="form-group">
          <label>Gender</label>
          <select id="filter-gender" class="form-control" onchange="loadData()">
            <option value="all">All</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="filter-location" class="form-control" placeholder="Town/City" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
      </div>
      <div style="margin-top: 15px; display: flex; justify-content: space-between;">
        <button class="btn btn-sm btn-primary" onclick="loadData(); toggleFilterPanel();">Apply Filters</button>
      </div>
    </div>
  </div>

  <div class="odoo-view-switchers">
    <button class="odoo-view-btn active" onclick="switchView('list')" id="btn-view-list" title="List View">
      <i data-lucide="list" style="width: 18px; height: 18px;"></i>
    </button>
    <button class="odoo-view-btn" onclick="switchView('kanban')" id="btn-view-kanban" title="Kanban View">
      <i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i>
    </button>
  </div>
</div>

<div id="view-list" class="view-container active">
  <div style="overflow-x: auto;">
    <table class="odoo-list-table">
      <thead id="list-thead"></thead>
      <tbody id="list-tbody"></tbody>
    </table>
  </div>
</div>

<div id="view-kanban" class="view-container">
  <div class="odoo-kanban" id="kanban-board"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let currentData = [];

  function toggleFilterPanel() {
    document.getElementById('filter-panel').classList.toggle('open');
  }

  function switchView(viewName) {
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.odoo-view-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`view-${viewName}`).classList.add('active');
    document.getElementById(`btn-view-${viewName}`).classList.add('active');
    renderView(viewName);
  }

  function loadData() {
    const search = document.getElementById('search-input').value;
    const gender = document.getElementById('filter-gender').value;
    const location = document.getElementById('filter-location').value;
    
    let params = `entity=members&search=${encodeURIComponent(search)}&gender=${gender}&location=${encodeURIComponent(location)}`;
    
    fetch(`{{ url_for('reports.get_report_data') }}?${params}`)
      .then(res => res.json())
      .then(data => {
        currentData = data;
        const activeView = document.querySelector('.view-container.active').id.replace('view-', '');
        renderView(activeView);
      })
      .catch(err => console.error(err));
  }

  function renderView(viewName) {
    if (viewName === 'list') renderList();
    else if (viewName === 'kanban') renderKanban();
  }

  function renderList() {
    const thead = document.getElementById('list-thead');
    const tbody = document.getElementById('list-tbody');
    thead.innerHTML = '<tr><th>Name</th><th>Phone</th><th>Gender</th><th>Location</th><th>Group</th><th>Registered</th><th>Actions</th></tr>';
    tbody.innerHTML = '';
    
    if (currentData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No members found.</td></tr>';
      return;
    }

    currentData.forEach(row => {
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-primary">${row.full_name}</td>
        <td class="td-mono">${row.phone_number}</td>
        <td>${row.gender}</td>
        <td>${row.location}</td>
        <td><span class="badge badge-primary">${row.group_name}</span></td>
        <td>${row.registered_at}</td>
        <td><a href="/members/${row.id}" class="btn btn-sm btn-outline-primary"><i data-lucide="eye" style="width:14px;height:14px;"></i> View</a></td>
      `;
      tbody.appendChild(tr);
    });
    lucide.createIcons();
  }

  function renderKanban() {
    const board = document.getElementById('kanban-board');
    board.innerHTML = '';
    
    if (currentData.length === 0) {
      board.innerHTML = '<p>No members found.</p>';
      return;
    }

    let grouped = {};
    currentData.forEach(item => {
      let key = item.group_name || 'Unassigned';
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(item);
    });

    for (const [key, items] of Object.entries(grouped)) {
      let colDiv = document.createElement('div');
      colDiv.className = 'kanban-column';
      colDiv.innerHTML = `<div class="kanban-column-title"><span>${key.toUpperCase()}</span> <span>${items.length}</span></div>`;
      
      items.forEach(item => {
        let card = document.createElement('div');
        card.className = 'kanban-card';
        card.onclick = () => window.location.href = `/members/${item.id}`;
        card.innerHTML = `
          <div class="kanban-card-title">${item.full_name}</div>
          <div style="font-size: 0.9rem; color: var(--text-secondary);"><i data-lucide="phone" style="width:12px;height:12px;"></i> ${item.phone_number}</div>
          <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top:5px;">${item.location}</div>
        `;
        colDiv.appendChild(card);
      });
      board.appendChild(colDiv);
    }
    lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
