{% extends 'base.html' %}
{% block title %}System Reports & Exports{% endblock %}

{% block extra_css %}
<!-- Styles centralized in main.css -->
{% endblock %}

{% block content %}
<div class="odoo-control-panel">
  <div class="odoo-breadcrumb">
    <h2>Reporting</h2>
  </div>

  <div class="odoo-actions">
    <div class="odoo-search-container">
    <i data-lucide="search" class="odoo-search-icon" style="width: 16px; height: 16px;"></i>
    <input type="text" id="search-input" class="odoo-search-bar" placeholder="Search..." onkeyup="if(event.key === 'Enter') loadData()">
    <button class="odoo-search-dropdown-btn" onclick="toggleFilterPanel()" title="Advanced Filters">
      <i data-lucide="sliders-horizontal" style="width: 16px; height: 16px;"></i>
    </button>

    <!-- Advanced Filter Panel Popup -->
    <div class="odoo-filter-panel" id="filter-panel">
      <div class="filter-grid">
        <div class="form-group">
          <label>Entity</label>
          <select id="filter-entity" class="form-control" onchange="updateFilterVisibility(); loadFilterOptions(); loadData();">
            <option value="members">Members</option>
            <option value="loans">Loans</option>
            <option value="groups">Groups</option>
            <option value="sms_logs">SMS Logs</option>
            <option value="surveys">Surveys</option>
          </select>
        </div>
        <div class="form-group">
          <label>Group</label>
          <select id="filter-group" class="form-control" onchange="loadData()">
            <option value="all">All Groups</option>
            {% for group in groups %}
            <option value="{{ group.id }}">{{ group.name }}</option>
            {% endfor %}
          </select>
        </div>
        
        <!-- Member Specific -->
        <div class="form-group member-filter">
          <label>Name</label>
          <input type="text" id="filter-full-name" class="form-control" list="report-member-name-options" placeholder="Member name" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group member-filter">
          <label>Phone</label>
          <input type="text" id="filter-member-phone" class="form-control" list="report-member-phone-options" placeholder="Phone number" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group member-filter">
          <label>National ID</label>
          <input type="text" id="filter-member-id" class="form-control" list="report-member-id-options" placeholder="ID number" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group member-filter">
          <label>Gender</label>
          <select id="filter-gender" class="form-control" onchange="loadData()">
            <option value="all">All</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="form-group member-filter">
          <label>Location</label>
          <input type="text" id="filter-location" class="form-control" list="report-member-location-options" placeholder="Town/City" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group member-filter">
          <label>From Date</label>
          <input type="date" id="filter-start-date" class="form-control" onchange="loadData()">
        </div>
        <div class="form-group member-filter">
          <label>To Date</label>
          <input type="date" id="filter-end-date" class="form-control" onchange="loadData()">
        </div>

        <!-- Loan Specific -->
        <div class="form-group loan-filter" style="display:none;">
          <label>Applicant</label>
          <input type="text" id="filter-applicant-name" class="form-control" list="report-loan-applicant-options" placeholder="Applicant name" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group loan-filter" style="display:none;">
          <label>Phone</label>
          <input type="text" id="filter-loan-phone" class="form-control" list="report-loan-phone-options" placeholder="Phone number" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group loan-filter" style="display:none;">
          <label>Amount</label>
          <input type="text" id="filter-amount-requested" class="form-control" list="report-loan-amount-options" placeholder="Requested amount" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group loan-filter" style="display:none;">
          <label>Status</label>
          <select id="filter-status" class="form-control" onchange="loadData()">
            <option value="all">All</option>
            <option value="submitted">Submitted</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="disbursement_pending">Disbursement In Progress</option>
            <option value="disbursed">Disbursed</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="form-group loan-filter" style="display:none;">
          <label>From Date</label>
          <input type="date" id="filter-loan-start-date" class="form-control" onchange="loadData()">
        </div>
        <div class="form-group loan-filter" style="display:none;">
          <label>To Date</label>
          <input type="date" id="filter-loan-end-date" class="form-control" onchange="loadData()">
        </div>

        <!-- Group Specific -->
        <div class="form-group group-filter" style="display:none;">
          <label>Group Name</label>
          <input type="text" id="filter-group-name-text" class="form-control" list="report-group-name-options" placeholder="Group name" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group group-filter" style="display:none;">
          <label>Description</label>
          <input type="text" id="filter-group-description" class="form-control" list="report-group-description-options" placeholder="Description" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group group-filter" style="display:none;">
          <label>Manager</label>
          <input type="text" id="filter-group-manager" class="form-control" list="report-group-manager-options" placeholder="Manager" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group group-filter" style="display:none;">
          <label>Members</label>
          <input type="text" id="filter-group-member-count" class="form-control" list="report-group-member-count-options" placeholder="Member count" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group group-filter" style="display:none;">
          <label>From Date</label>
          <input type="date" id="filter-group-start-date" class="form-control" onchange="loadData()">
        </div>
        <div class="form-group group-filter" style="display:none;">
          <label>To Date</label>
          <input type="date" id="filter-group-end-date" class="form-control" onchange="loadData()">
        </div>

        <!-- SMS Specific -->
        <div class="form-group sms-filter" style="display:none;">
          <label>Direction</label>
          <select id="filter-sms-direction" class="form-control" onchange="loadData()">
            <option value="all">All</option>
            <option value="incoming">Incoming (Received)</option>
            <option value="outgoing">Outgoing (Sent)</option>
          </select>
        </div>
        <div class="form-group sms-filter" style="display:none;">
          <label>Status</label>
          <select id="filter-sms-status" class="form-control" onchange="loadData()">
            <option value="all">All</option>
            <option value="received">Received</option>
            <option value="sent">Sent</option>
            <option value="failed">Failed</option>
          </select>
        </div>
        <div class="form-group sms-filter" style="display:none;">
          <label>Member</label>
          <select id="filter-sms-member" class="form-control" onchange="loadData()">
            <option value="all">All Members</option>
          </select>
        </div>
        <div class="form-group sms-filter" style="display:none;">
          <label>From Date</label>
          <input type="date" id="filter-sms-start-date" class="form-control" onchange="loadData()">
        </div>
        <div class="form-group sms-filter" style="display:none;">
          <label>To Date</label>
          <input type="date" id="filter-sms-end-date" class="form-control" onchange="loadData()">
        </div>
        <div class="form-group sms-filter" style="display:none;">
          <label>Sender</label>
          <input type="text" id="filter-sms-sender" class="form-control" list="report-sms-sender-options" placeholder="Sender phone" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group sms-filter" style="display:none;">
          <label>Recipient</label>
          <input type="text" id="filter-sms-recipient" class="form-control" list="report-sms-recipient-options" placeholder="Recipient phone" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group sms-filter" style="display:none;">
          <label>Message</label>
          <input type="text" id="filter-sms-message" class="form-control" placeholder="Message text" onkeyup="if(event.key === 'Enter') loadData()">
        </div>

        <!-- Survey Specific -->
        <div class="form-group survey-filter" style="display:none;">
          <label>Title</label>
          <input type="text" id="filter-survey-title" class="form-control" list="report-survey-title-options" placeholder="Survey title" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group survey-filter" style="display:none;">
          <label>Creator</label>
          <input type="text" id="filter-survey-creator" class="form-control" list="report-survey-creator-options" placeholder="Creator" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group survey-filter" style="display:none;">
          <label>Description</label>
          <input type="text" id="filter-survey-description" class="form-control" list="report-survey-description-options" placeholder="Description" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group survey-filter" style="display:none;">
          <label>Questions</label>
          <input type="text" id="filter-survey-question-count" class="form-control" list="report-survey-question-count-options" placeholder="Question count" onkeyup="if(event.key === 'Enter') loadData()">
        </div>
        <div class="form-group survey-filter" style="display:none;">
          <label>From Date</label>
          <input type="date" id="filter-survey-start-date" class="form-control" onchange="loadData()">
        </div>
        <div class="form-group survey-filter" style="display:none;">
          <label>To Date</label>
          <input type="date" id="filter-survey-end-date" class="form-control" onchange="loadData()">
        </div>
      </div>
      <div style="margin-top: 15px; display: flex; justify-content: space-between;">
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-sm btn-outline-secondary" onclick="clearFilters()">
            <i data-lucide="x" style="width:14px;height:14px;"></i> Clear
          </button>
          <button class="btn btn-sm btn-outline-primary" onclick="window.location.href=getExportUrl('csv')">
            <i data-lucide="file-spreadsheet" style="width:14px;height:14px;"></i> Export CSV
          </button>
          <button class="btn btn-sm btn-outline-primary" onclick="window.location.href=getExportUrl('pdf')">
            <i data-lucide="file-text" style="width:14px;height:14px;"></i> Export PDF
          </button>
        </div>
        <button class="btn btn-sm btn-primary" onclick="loadData(); toggleFilterPanel();">Apply Filters</button>
      </div>
    </div>
  </div>

    <div class="odoo-view-switchers">
      <button class="odoo-view-btn active" onclick="switchView('list')" id="btn-view-list" title="List View">
        <i data-lucide="list" style="width: 18px; height: 18px;"></i>
      </button>
      <button class="odoo-view-btn" onclick="switchView('kanban')" id="btn-view-kanban" title="Kanban View">
        <i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i>
      </button>
      <button class="odoo-view-btn" onclick="switchView('graph')" id="btn-view-graph" title="Graph View">
        <i data-lucide="bar-chart-2" style="width: 18px; height: 18px;"></i>
      </button>
    </div>
  </div>
</div>

<!-- List View Container -->
<div id="view-list" class="view-container active">
  <div style="overflow-x: auto;">
    <table class="odoo-list-table" id="list-table">
      <thead id="list-thead"></thead>
      <tbody id="list-tbody"></tbody>
    </table>
  </div>
</div>

<!-- Kanban View Container -->
<div id="view-kanban" class="view-container">
  <div class="odoo-kanban" id="kanban-board">
    <!-- Rendered via JS -->
  </div>
</div>

<!-- Graph View Container -->
<div id="view-graph" class="view-container">
  <div class="charts-grid">
    <div class="chart-card">
      <h3>Distribution</h3>
      <div class="chart-container" style="height: 300px; position: relative;">
        <canvas id="mainChart"></canvas>
      </div>
    </div>
  </div>
</div>

<datalist id="report-member-name-options"></datalist>
<datalist id="report-member-phone-options"></datalist>
<datalist id="report-member-id-options"></datalist>
<datalist id="report-member-location-options"></datalist>
<datalist id="report-loan-applicant-options"></datalist>
<datalist id="report-loan-phone-options"></datalist>
<datalist id="report-loan-amount-options"></datalist>
<datalist id="report-group-name-options"></datalist>
<datalist id="report-group-description-options"></datalist>
<datalist id="report-group-manager-options"></datalist>
<datalist id="report-group-member-count-options"></datalist>
<datalist id="report-sms-sender-options"></datalist>
<datalist id="report-sms-recipient-options"></datalist>
<datalist id="report-survey-title-options"></datalist>
<datalist id="report-survey-creator-options"></datalist>
<datalist id="report-survey-description-options"></datalist>
<datalist id="report-survey-question-count-options"></datalist>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  let currentData = [];
  let currentChart = null;

  function toggleFilterPanel() {
    document.getElementById('filter-panel').classList.toggle('open');
  }

  function updateFilterVisibility() {
    const entity = document.getElementById('filter-entity').value;
    document.querySelectorAll('.member-filter').forEach(el => el.style.display = (entity === 'members') ? 'block' : 'none');
    document.querySelectorAll('.loan-filter').forEach(el => el.style.display = (entity === 'loans') ? 'block' : 'none');
    document.querySelectorAll('.group-filter').forEach(el => el.style.display = (entity === 'groups') ? 'block' : 'none');
    document.querySelectorAll('.sms-filter').forEach(el => el.style.display = (entity === 'sms_logs') ? 'block' : 'none');
    document.querySelectorAll('.survey-filter').forEach(el => el.style.display = (entity === 'surveys') ? 'block' : 'none');
  }

  function switchView(viewName) {
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.odoo-view-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`view-${viewName}`).classList.add('active');
    document.getElementById(`btn-view-${viewName}`).classList.add('active');
    
    renderView(viewName);
  }

  function getFilterParamsString() {
    const entity = document.getElementById('filter-entity').value;
    const search = document.getElementById('search-input').value;
    const group = document.getElementById('filter-group').value;
    
    let params = `entity=${entity}&search=${encodeURIComponent(search)}&group_id=${group}`;
    
    if (entity === 'members') {
      params += `&gender=${document.getElementById('filter-gender').value}`;
      params += `&location=${encodeURIComponent(document.getElementById('filter-location').value)}`;
      params += `&start_date=${encodeURIComponent(document.getElementById('filter-start-date').value)}`;
      params += `&end_date=${encodeURIComponent(document.getElementById('filter-end-date').value)}`;
      params += `&filter_full_name=${encodeURIComponent(document.getElementById('filter-full-name').value)}`;
      params += `&filter_phone_number=${encodeURIComponent(document.getElementById('filter-member-phone').value)}`;
      params += `&filter_id_number=${encodeURIComponent(document.getElementById('filter-member-id').value)}`;
      params += `&filter_gender=${encodeURIComponent(document.getElementById('filter-gender').value === 'all' ? '' : document.getElementById('filter-gender').value)}`;
      params += `&filter_location=${encodeURIComponent(document.getElementById('filter-location').value)}`;
      params += `&filter_group_name=${encodeURIComponent(document.getElementById('filter-group').selectedOptions[0].textContent === 'All Groups' ? '' : document.getElementById('filter-group').selectedOptions[0].textContent)}`;
    } else if (entity === 'loans') {
      params += `&status=${document.getElementById('filter-status').value}`;
      params += `&start_date=${encodeURIComponent(document.getElementById('filter-loan-start-date').value)}`;
      params += `&end_date=${encodeURIComponent(document.getElementById('filter-loan-end-date').value)}`;
      params += `&filter_applicant_name=${encodeURIComponent(document.getElementById('filter-applicant-name').value)}`;
      params += `&filter_phone_number=${encodeURIComponent(document.getElementById('filter-loan-phone').value)}`;
      params += `&filter_amount_requested=${encodeURIComponent(document.getElementById('filter-amount-requested').value)}`;
      params += `&filter_status=${encodeURIComponent(document.getElementById('filter-status').value === 'all' ? '' : document.getElementById('filter-status').value)}`;
      params += `&filter_group_name=${encodeURIComponent(document.getElementById('filter-group').selectedOptions[0].textContent === 'All Groups' ? '' : document.getElementById('filter-group').selectedOptions[0].textContent)}`;
    } else if (entity === 'groups') {
      params += `&start_date=${encodeURIComponent(document.getElementById('filter-group-start-date').value)}`;
      params += `&end_date=${encodeURIComponent(document.getElementById('filter-group-end-date').value)}`;
      params += `&filter_name=${encodeURIComponent(document.getElementById('filter-group-name-text').value)}`;
      params += `&filter_description=${encodeURIComponent(document.getElementById('filter-group-description').value)}`;
      params += `&filter_manager=${encodeURIComponent(document.getElementById('filter-group-manager').value)}`;
      params += `&filter_member_count=${encodeURIComponent(document.getElementById('filter-group-member-count').value)}`;
    } else if (entity === 'sms_logs') {
      const direction = document.getElementById('filter-sms-direction').value;
      const smsStatus = document.getElementById('filter-sms-status').value;
      params += `&direction=${encodeURIComponent(direction)}`;
      params += `&sms_status=${encodeURIComponent(smsStatus)}`;
      params += `&member_id=${encodeURIComponent(document.getElementById('filter-sms-member').value)}`;
      params += `&start_date=${encodeURIComponent(document.getElementById('filter-sms-start-date').value)}`;
      params += `&end_date=${encodeURIComponent(document.getElementById('filter-sms-end-date').value)}`;
      params += `&filter_direction=${encodeURIComponent(direction === 'all' ? '' : direction)}`;
      params += `&filter_status=${encodeURIComponent(smsStatus === 'all' ? '' : smsStatus)}`;
      params += `&filter_sender=${encodeURIComponent(document.getElementById('filter-sms-sender').value)}`;
      params += `&filter_recipient=${encodeURIComponent(document.getElementById('filter-sms-recipient').value)}`;
      params += `&filter_message=${encodeURIComponent(document.getElementById('filter-sms-message').value)}`;
    } else if (entity === 'surveys') {
      params += `&start_date=${encodeURIComponent(document.getElementById('filter-survey-start-date').value)}`;
      params += `&end_date=${encodeURIComponent(document.getElementById('filter-survey-end-date').value)}`;
      params += `&filter_title=${encodeURIComponent(document.getElementById('filter-survey-title').value)}`;
      params += `&filter_creator=${encodeURIComponent(document.getElementById('filter-survey-creator').value)}`;
      params += `&filter_description=${encodeURIComponent(document.getElementById('filter-survey-description').value)}`;
      params += `&filter_question_count=${encodeURIComponent(document.getElementById('filter-survey-question-count').value)}`;
    }
    return params;
  }

  function getExportUrl(format) {
    const params = getFilterParamsString();
    return `{{ url_for('reports.custom_export') }}?${params}&format=${encodeURIComponent(format)}`;
  }

  function populateDatalist(id, values) {
    const datalist = document.getElementById(id);
    datalist.innerHTML = '';
    (values || []).forEach(value => {
      const option = document.createElement('option');
      option.value = value;
      datalist.appendChild(option);
    });
  }

  function clearFilters() {
    document.getElementById('search-input').value = '';
    document.querySelectorAll('#filter-panel input').forEach(input => input.value = '');
    document.getElementById('filter-group').value = 'all';
    document.getElementById('filter-gender').value = 'all';
    document.getElementById('filter-status').value = 'all';
    document.getElementById('filter-sms-direction').value = 'all';
    document.getElementById('filter-sms-status').value = 'all';
    document.getElementById('filter-sms-member').value = 'all';
    loadData();
  }

  function loadFilterOptions() {
    const entity = document.getElementById('filter-entity').value;

    fetch(`{{ url_for('reports.get_filter_options') }}?entity=${encodeURIComponent(entity)}`)
      .then(res => res.json())
      .then(options => {
        if (entity === 'members') {
          populateDatalist('report-member-name-options', options.full_name);
          populateDatalist('report-member-phone-options', options.phone_number);
          populateDatalist('report-member-id-options', options.id_number);
          populateDatalist('report-member-location-options', options.location);
        } else if (entity === 'loans') {
          populateDatalist('report-loan-applicant-options', options.applicant_name);
          populateDatalist('report-loan-phone-options', options.phone_number);
          populateDatalist('report-loan-amount-options', options.amount_requested);
        } else if (entity === 'groups') {
          populateDatalist('report-group-name-options', options.name);
          populateDatalist('report-group-description-options', options.description);
          populateDatalist('report-group-manager-options', options.manager);
          populateDatalist('report-group-member-count-options', options.member_count);
        } else if (entity === 'sms_logs') {
          populateDatalist('report-sms-sender-options', options.sender);
          populateDatalist('report-sms-recipient-options', options.recipient);
          const memberSelect = document.getElementById('filter-sms-member');
          const currentVal = memberSelect.value;
          memberSelect.innerHTML = '<option value="all">All Members</option>';
          (options.members || []).forEach(member => {
            const opt = document.createElement('option');
            opt.value = member.id;
            opt.textContent = member.label;
            memberSelect.appendChild(opt);
          });
          memberSelect.value = currentVal || 'all';
        } else if (entity === 'surveys') {
          populateDatalist('report-survey-title-options', options.title);
          populateDatalist('report-survey-creator-options', options.creator);
          populateDatalist('report-survey-description-options', options.description);
          populateDatalist('report-survey-question-count-options', options.question_count);
        }
      })
      .catch(err => console.error(err));
  }

  function loadData() {
    const params = getFilterParamsString();
    
    fetch(`{{ url_for('reports.get_report_data') }}?${params}`)
      .then(res => res.json())
      .then(data => {
        currentData = data;
        
        // Find which view is active
        const activeView = document.querySelector('.view-container.active').id.replace('view-', '');
        renderView(activeView);
      })
      .catch(err => console.error("Error fetching report data:", err));
  }

  function renderView(viewName) {
    const entity = document.getElementById('filter-entity').value;
    
    if (viewName === 'list') {
      renderList(entity);
    } else if (viewName === 'kanban') {
      renderKanban(entity);
    } else if (viewName === 'graph') {
      renderGraph(entity);
    }
  }

  function renderList(entity) {
    const thead = document.getElementById('list-thead');
    const tbody = document.getElementById('list-tbody');
    thead.innerHTML = '';
    tbody.innerHTML = '';
    
    if (currentData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">No data found.</td></tr>';
      return;
    }

    // Determine columns
    let cols = [];
    if (entity === 'members') {
      cols = ['full_name', 'phone_number', 'gender', 'location', 'group_name', 'registered_at'];
    } else if (entity === 'loans') {
      cols = ['applicant_name', 'phone_number', 'amount_requested', 'status', 'group_name', 'created_at'];
    } else if (entity === 'groups') {
      cols = ['name', 'description', 'member_count', 'manager', 'created_at'];
    } else if (entity === 'sms_logs') {
      cols = ['direction', 'sender', 'recipient', 'member_name', 'message', 'status', 'created_at'];
    } else {
      cols = ['title', 'description', 'question_count', 'creator', 'created_at'];
    }

    // Build header
    let trHead = document.createElement('tr');
    cols.forEach(c => {
      let th = document.createElement('th');
      th.innerText = c.replace('_', ' ').toUpperCase();
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);

    // Build rows
    currentData.forEach(row => {
      let tr = document.createElement('tr');
      cols.forEach(c => {
        let td = document.createElement('td');
        td.innerText = row[c];
        if(c === 'status') {
           td.innerHTML = `<span class="badge badge-${row[c]==='approved'?'success':(row[c]==='rejected'?'danger':'warning')}">${row[c]}</span>`;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function renderKanban(entity) {
    const board = document.getElementById('kanban-board');
    board.innerHTML = '';
    
    if (currentData.length === 0) {
      board.innerHTML = '<p>No data found.</p>';
      return;
    }

    // Grouping logic
    const groupByMap = {
      members: 'group_name',
      loans: 'status',
      groups: 'manager',
      sms_logs: 'created_at',
      surveys: 'creator'
    };
    let groupBy = groupByMap[entity] || 'status';
    let grouped = {};
    
    currentData.forEach(item => {
      let key = item[groupBy] || 'Unassigned';
      if (entity === 'sms_logs' && groupBy === 'created_at' && key !== 'Unassigned') {
        key = key.split(' ')[0];
      }
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(item);
    });

    // Render columns
    for (const [key, items] of Object.entries(grouped)) {
      let colDiv = document.createElement('div');
      colDiv.className = 'kanban-column';
      
      let titleHtml = `<div class="kanban-column-title"><span>${key.toUpperCase()}</span> <span>${items.length}</span></div>`;
      colDiv.innerHTML = titleHtml;
      
      items.forEach(item => {
        let card = document.createElement('div');
        card.className = 'kanban-card';
        if (entity === 'members') {
          card.innerHTML = `
            <div class="kanban-card-title">${item.full_name}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);"><i data-lucide="phone" style="width:12px;height:12px;"></i> ${item.phone_number}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top:5px;">${item.location}</div>
          `;
        } else if (entity === 'loans') {
          card.innerHTML = `
            <div class="kanban-card-title">${item.applicant_name}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);">Amount: KSh ${item.amount_requested}</div>
          `;
        } else if (entity === 'groups') {
          card.innerHTML = `
            <div class="kanban-card-title">${item.name}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);">${item.member_count} members</div>
          `;
        } else if (entity === 'sms_logs') {
          card.innerHTML = `
            <div class="kanban-card-title">${item.status}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);">${item.sender} -> ${item.recipient}</div>
          `;
        } else {
          card.innerHTML = `
            <div class="kanban-card-title">${item.title}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);">${item.question_count} questions</div>
          `;
        }
        colDiv.appendChild(card);
      });
      
      board.appendChild(colDiv);
    }
    lucide.createIcons();
  }

  function renderGraph(entity) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    
    if (currentChart) {
      currentChart.destroy();
    }
    
    const groupByMap = {
      members: 'group_name',
      loans: 'status',
      groups: 'manager',
      sms_logs: 'status',
      surveys: 'creator'
    };
    let groupBy = groupByMap[entity] || 'status';
    let grouped = {};
    currentData.forEach(item => {
      let key = item[groupBy] || 'Unassigned';
      if (!grouped[key]) grouped[key] = 0;
      grouped[key]++;
    });

    let labels = Object.keys(grouped);
    let data = Object.values(grouped);
    
    Chart.defaults.color = '#9ca3af';
    currentChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#3b82f6'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%'
      }
    });
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    updateFilterVisibility();
    if (window.initCustomSelects) window.initCustomSelects();
    loadFilterOptions();
    loadData();
  });
</script>
{% endblock %}
