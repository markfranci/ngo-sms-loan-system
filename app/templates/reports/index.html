{% extends 'base.html' %}
{% block title %}System Reports & Exports{% endblock %}

{% block extra_css %}
<!-- Styles centralized in main.css -->
{% endblock %}

{% block content %}
<div class="odoo-control-panel">
  <div class="odoo-breadcrumb">
    <h2>Reporting</h2>
  </div>

  <div class="odoo-actions">
    <div class="odoo-search-container">
    <i data-lucide="search" class="odoo-search-icon" style="width: 16px; height: 16px;"></i>
    <input type="text" id="search-input" class="odoo-search-bar" placeholder="Search..." onkeyup="if(event.key === 'Enter') loadData()">
    <button class="odoo-search-dropdown-btn" onclick="toggleFilterPanel()" title="Advanced Filters">
      <i data-lucide="sliders-horizontal" style="width: 16px; height: 16px;"></i>
    </button>

    <!-- Advanced Filter Panel Popup -->
    <div class="odoo-filter-panel" id="filter-panel">
      <div class="filter-grid">
        <div class="form-group">
          <label>Entity</label>
          <select id="filter-entity" class="form-select" onchange="updateFilterVisibility(); loadData();">
            <option value="members">Members</option>
            <option value="loans">Loans</option>
          </select>
        </div>
        <div class="form-group">
          <label>Group</label>
          <select id="filter-group" class="form-select" onchange="loadData()">
            <option value="all">All Groups</option>
            {% for group in groups %}
            <option value="{{ group.id }}">{{ group.name }}</option>
            {% endfor %}
          </select>
        </div>
        
        <!-- Member Specific -->
        <div class="form-group member-filter">
          <label>Gender</label>
          <select id="filter-gender" class="form-select" onchange="loadData()">
            <option value="all">All</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="form-group member-filter">
          <label>Location</label>
          <input type="text" id="filter-location" class="form-input" placeholder="Town/City" onkeyup="if(event.key === 'Enter') loadData()">
        </div>

        <!-- Loan Specific -->
        <div class="form-group loan-filter" style="display:none;">
          <label>Status</label>
          <select id="filter-status" class="form-select" onchange="loadData()">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div class="panel-actions">
        <div class="button-row">
          <button class="btn btn-sm btn-outline-primary" onclick="window.location.href=getExportUrl('csv')">
            <i data-lucide="file-spreadsheet"></i> Export CSV
          </button>
          <button class="btn btn-sm btn-outline-primary" onclick="window.location.href=getExportUrl('pdf')">
            <i data-lucide="file-text"></i> Export PDF
          </button>
        </div>
        <button class="btn btn-sm btn-primary" onclick="loadData(); toggleFilterPanel();">Apply Filters</button>
      </div>
    </div>
  </div>

    <div class="odoo-view-switchers">
      <button class="odoo-view-btn active" onclick="switchView('list')" id="btn-view-list" title="List View">
        <i data-lucide="list" style="width: 18px; height: 18px;"></i>
      </button>
      <button class="odoo-view-btn" onclick="switchView('kanban')" id="btn-view-kanban" title="Kanban View">
        <i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i>
      </button>
      <button class="odoo-view-btn" onclick="switchView('graph')" id="btn-view-graph" title="Graph View">
        <i data-lucide="bar-chart-2" style="width: 18px; height: 18px;"></i>
      </button>
    </div>
  </div>
</div>

<!-- List View Container -->
<div id="view-list" class="view-container active">
  <div class="table-wrapper">
    <table class="odoo-list-table" id="list-table">
      <thead id="list-thead"></thead>
      <tbody id="list-tbody"></tbody>
    </table>
  </div>
</div>

<!-- Kanban View Container -->
<div id="view-kanban" class="view-container">
  <div class="odoo-kanban" id="kanban-board">
    <!-- Rendered via JS -->
  </div>
</div>

<!-- Graph View Container -->
<div id="view-graph" class="view-container">
  <div class="charts-grid">
    <div class="chart-card">
      <h3>Distribution</h3>
      <div class="chart-container" style="height: 300px; position: relative;">
        <canvas id="mainChart"></canvas>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  let currentData = [];
  let currentChart = null;

  function toggleFilterPanel() {
    document.getElementById('filter-panel').classList.toggle('open');
  }

  function updateFilterVisibility() {
    const entity = document.getElementById('filter-entity').value;
    document.querySelectorAll('.member-filter').forEach(el => el.style.display = (entity === 'members') ? 'block' : 'none');
    document.querySelectorAll('.loan-filter').forEach(el => el.style.display = (entity === 'loans') ? 'block' : 'none');
  }

  function switchView(viewName) {
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.odoo-view-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`view-${viewName}`).classList.add('active');
    document.getElementById(`btn-view-${viewName}`).classList.add('active');
    
    renderView(viewName);
  }

  function getFilterParamsString() {
    const entity = document.getElementById('filter-entity').value;
    const search = document.getElementById('search-input').value;
    const group = document.getElementById('filter-group').value;
    
    let params = `entity=${entity}&search=${encodeURIComponent(search)}&group_id=${group}`;
    
    if (entity === 'members') {
      params += `&gender=${document.getElementById('filter-gender').value}`;
      params += `&location=${encodeURIComponent(document.getElementById('filter-location').value)}`;
    } else {
      params += `&status=${document.getElementById('filter-status').value}`;
    }
    return params;
  }

  function getExportUrl(format) {
    const params = getFilterParamsString();
    return `{{ url_for('reports.custom_export') }}?${params}&format=${encodeURIComponent(format)}`;
  }

  function loadData() {
    const params = getFilterParamsString();
    
    fetch(`{{ url_for('reports.get_report_data') }}?${params}`)
      .then(res => res.json())
      .then(data => {
        currentData = data;
        
        // Find which view is active
        const activeView = document.querySelector('.view-container.active').id.replace('view-', '');
        renderView(activeView);
      })
      .catch(err => console.error("Error fetching report data:", err));
  }

  function renderView(viewName) {
    const entity = document.getElementById('filter-entity').value;
    
    if (viewName === 'list') {
      renderList(entity);
    } else if (viewName === 'kanban') {
      renderKanban(entity);
    } else if (viewName === 'graph') {
      renderGraph(entity);
    }
  }

  function renderList(entity) {
    const thead = document.getElementById('list-thead');
    const tbody = document.getElementById('list-tbody');
    thead.innerHTML = '';
    tbody.innerHTML = '';
    
    if (currentData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">No data found.</td></tr>';
      return;
    }

    // Determine columns
    let cols = [];
    if (entity === 'members') {
      cols = ['full_name', 'phone_number', 'gender', 'location', 'group_name', 'registered_at'];
    } else {
      cols = ['applicant_name', 'phone_number', 'amount_requested', 'score', 'status', 'group_name', 'created_at'];
    }

    // Build header
    let trHead = document.createElement('tr');
    cols.forEach(c => {
      let th = document.createElement('th');
      th.innerText = c.replace('_', ' ').toUpperCase();
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);

    // Build rows
    currentData.forEach(row => {
      let tr = document.createElement('tr');
      cols.forEach(c => {
        let td = document.createElement('td');
        td.innerText = row[c];
        if(c === 'status') {
           td.innerHTML = `<span class="badge badge-${row[c]==='approved'?'success':(row[c]==='rejected'?'danger':'warning')}">${row[c]}</span>`;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function renderKanban(entity) {
    const board = document.getElementById('kanban-board');
    board.innerHTML = '';
    
    if (currentData.length === 0) {
      board.innerHTML = '<p>No data found.</p>';
      return;
    }

    // Grouping logic
    let groupBy = entity === 'members' ? 'group_name' : 'status';
    let grouped = {};
    
    currentData.forEach(item => {
      let key = item[groupBy] || 'Unassigned';
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(item);
    });

    // Render columns
    for (const [key, items] of Object.entries(grouped)) {
      let colDiv = document.createElement('div');
      colDiv.className = 'kanban-column';
      
      let titleHtml = `<div class="kanban-column-title"><span>${key.toUpperCase()}</span> <span>${items.length}</span></div>`;
      colDiv.innerHTML = titleHtml;
      
      items.forEach(item => {
        let card = document.createElement('div');
        card.className = 'kanban-card';
        if (entity === 'members') {
          card.innerHTML = `
            <div class="kanban-card-title">${item.full_name}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);"><i data-lucide="phone" style="width:12px;height:12px;"></i> ${item.phone_number}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top:5px;">${item.location}</div>
          `;
        } else {
          card.innerHTML = `
            <div class="kanban-card-title">${item.applicant_name}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);">Amount: KSh ${item.amount_requested}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary);">Score: ${item.score}</div>
          `;
        }
        colDiv.appendChild(card);
      });
      
      board.appendChild(colDiv);
    }
    lucide.createIcons();
  }

  function renderGraph(entity) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    
    if (currentChart) {
      currentChart.destroy();
    }
    
    let groupBy = entity === 'members' ? 'group_name' : 'status';
    let grouped = {};
    currentData.forEach(item => {
      let key = item[groupBy] || 'Unassigned';
      if (!grouped[key]) grouped[key] = 0;
      grouped[key]++;
    });

    let labels = Object.keys(grouped);
    let data = Object.values(grouped);
    
    Chart.defaults.color = '#9ca3af';
    currentChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#3b82f6'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%'
      }
    });
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    updateFilterVisibility();
    if (window.initCustomSelects) window.initCustomSelects();
    loadData();
  });
</script>
{% endblock %}
