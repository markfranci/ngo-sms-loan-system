{% extends 'base.html' %}
{% block title %}SME Groups{% endblock %}

{% block extra_css %}
<!-- Styles centralized in main.css -->
{% endblock %}

{% block content %}
<div class="odoo-control-panel">
  <div class="odoo-breadcrumb">
    <h2>SME Groups</h2>
  </div>
  <div class="odoo-actions">
    <div class="odoo-search-container">
      <i data-lucide="search" class="odoo-search-icon" style="width: 16px; height: 16px;"></i>
      <input type="text" id="search-input" class="odoo-search-bar" placeholder="Search group name..." onkeyup="if(event.key === 'Enter') loadData()">
      <button class="odoo-search-dropdown-btn" onclick="toggleFilterPanel()" title="Advanced Filters">
        <i data-lucide="sliders-horizontal" style="width: 16px; height: 16px;"></i>
      </button>

      <div class="odoo-filter-panel" id="filter-panel">
        <div class="filter-grid">
          <div class="form-group">
            <label>Group Name</label>
            <input type="text" id="filter-name" class="form-control" list="group-name-options" placeholder="Group name" onkeyup="if(event.key === 'Enter') loadData()">
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" id="filter-description" class="form-control" list="group-description-options" placeholder="Description" onkeyup="if(event.key === 'Enter') loadData()">
          </div>
          <div class="form-group">
            <label>Members</label>
            <input type="text" id="filter-member-count" class="form-control" list="group-member-count-options" placeholder="Member count" onkeyup="if(event.key === 'Enter') loadData()">
          </div>
          <div class="form-group">
            <label>Manager</label>
            <input type="text" id="filter-manager" class="form-control" list="group-manager-options" placeholder="Manager" onkeyup="if(event.key === 'Enter') loadData()">
          </div>
          <div class="form-group">
            <label>Created At</label>
            <input type="text" id="filter-created-at" class="form-control" list="group-created-options" placeholder="YYYY-MM-DD" onkeyup="if(event.key === 'Enter') loadData()">
          </div>
        </div>
        <div style="margin-top: 15px; display: flex; justify-content: space-between;">
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-sm btn-outline-primary" onclick="window.location.href=getExportUrl('csv')">
              <i data-lucide="file-spreadsheet" style="width:14px;height:14px;"></i> Export CSV
            </button>
            <button class="btn btn-sm btn-outline-primary" onclick="window.location.href=getExportUrl('pdf')">
              <i data-lucide="file-text" style="width:14px;height:14px;"></i> Export PDF
            </button>
          </div>
          <button class="btn btn-sm btn-primary" onclick="loadData(); toggleFilterPanel();">Apply Filters</button>
        </div>
      </div>
    </div>

    <div class="odoo-view-switchers">
      <button class="odoo-view-btn active" onclick="switchView('kanban')" id="btn-view-kanban" title="Kanban View">
        <i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i>
      </button>
      <button class="odoo-view-btn" onclick="switchView('list')" id="btn-view-list" title="List View">
        <i data-lucide="list" style="width: 18px; height: 18px;"></i>
      </button>
    </div>
    
    {% if current_user.role == 'admin' %}
    <a href="{{ url_for('groups.create') }}" class="btn btn-primary" style="height: 100%;"><i data-lucide="plus" style="width:16px;height:16px;margin-right:4px;"></i> New Group</a>
    {% endif %}
  </div>
</div>

<div id="view-kanban" class="view-container active">
  <div class="odoo-kanban" id="kanban-board"></div>
</div>

<div id="view-list" class="view-container">
  <div style="overflow-x: auto;">
    <table class="odoo-list-table">
      <thead id="list-thead"></thead>
      <tbody id="list-tbody"></tbody>
    </table>
  </div>
</div>

<datalist id="group-name-options"></datalist>
<datalist id="group-description-options"></datalist>
<datalist id="group-member-count-options"></datalist>
<datalist id="group-manager-options"></datalist>
<datalist id="group-created-options"></datalist>
{% endblock %}

{% block extra_js %}
<script>
  let currentData = [];
  const canDeleteRecords = {{ 'true' if current_user.role == 'admin' else 'false' }};

  function toggleFilterPanel() {
    document.getElementById('filter-panel').classList.toggle('open');
  }

  function switchView(viewName) {
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.odoo-view-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`view-${viewName}`).classList.add('active');
    document.getElementById(`btn-view-${viewName}`).classList.add('active');
    renderView(viewName);
  }

  function loadData() {
    const params = getFilterParamsString();

    fetch(`{{ url_for('reports.get_report_data') }}?${params}`)
      .then(res => res.json())
      .then(data => {
        currentData = data;
        const activeView = document.querySelector('.view-container.active').id.replace('view-', '');
        renderView(activeView);
      })
      .catch(err => console.error(err));
  }

  function getFilterParamsString() {
    const search = document.getElementById('search-input').value;
    const name = document.getElementById('filter-name').value;
    const description = document.getElementById('filter-description').value;
    const memberCount = document.getElementById('filter-member-count').value;
    const manager = document.getElementById('filter-manager').value;
    const createdAt = document.getElementById('filter-created-at').value;

    return [
      `entity=groups`,
      `search=${encodeURIComponent(search)}`,
      `filter_name=${encodeURIComponent(name)}`,
      `filter_description=${encodeURIComponent(description)}`,
      `filter_member_count=${encodeURIComponent(memberCount)}`,
      `filter_manager=${encodeURIComponent(manager)}`,
      `filter_created_at=${encodeURIComponent(createdAt)}`
    ].join('&');
  }

  function getExportUrl(format) {
    const params = getFilterParamsString();
    return `{{ url_for('reports.custom_export') }}?${params}&format=${encodeURIComponent(format)}`;
  }

  function populateDatalist(id, values) {
    const datalist = document.getElementById(id);
    datalist.innerHTML = '';
    (values || []).forEach(value => {
      const option = document.createElement('option');
      option.value = value;
      datalist.appendChild(option);
    });
  }

  function loadFilterOptions() {
    fetch(`{{ url_for('reports.get_filter_options') }}?entity=groups`)
      .then(res => res.json())
      .then(options => {
        populateDatalist('group-name-options', options.name);
        populateDatalist('group-description-options', options.description);
        populateDatalist('group-member-count-options', options.member_count);
        populateDatalist('group-manager-options', options.manager);
        populateDatalist('group-created-options', options.created_at);
      })
      .catch(err => console.error(err));
  }

  function renderView(viewName) {
    if (viewName === 'list') renderList();
    else if (viewName === 'kanban') renderKanban();
  }

  function renderList() {
    const thead = document.getElementById('list-thead');
    const tbody = document.getElementById('list-tbody');
    thead.innerHTML = '<tr><th>Group Name</th><th>Description</th><th>Members</th><th>Manager</th><th>Created At</th><th>Actions</th></tr>';
    tbody.innerHTML = '';
    
    if (currentData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No groups found.</td></tr>';
      return;
    }

    currentData.forEach(row => {
      let tr = document.createElement('tr');
      const deleteAction = canDeleteRecords ? `
        <form method="POST" action="/groups/${row.id}/delete" style="display:inline;" data-confirm-title="Delete Group" data-confirm="Delete this group? Members will remain as unassigned." data-confirm-action="Delete Group">
          <button type="submit" class="btn btn-sm btn-outline-danger"><i data-lucide="trash-2" style="width:14px;height:14px;"></i> Delete</button>
        </form>
      ` : '';
      tr.innerHTML = `
        <td class="td-primary">${row.name}</td>
        <td>${row.description}</td>
        <td><span class="badge badge-neutral">${row.member_count}</span></td>
        <td>${row.manager}</td>
        <td>${row.created_at}</td>
        <td>
          <a href="/groups/${row.id}" class="btn btn-sm btn-outline-primary"><i data-lucide="eye" style="width:14px;height:14px;"></i> View</a>
          ${deleteAction}
        </td>
      `;
      tbody.appendChild(tr);
    });
    lucide.createIcons();
  }

  function renderKanban() {
    const board = document.getElementById('kanban-board');
    board.innerHTML = '';
    
    if (currentData.length === 0) {
      board.innerHTML = '<p>No groups found.</p>';
      return;
    }

    currentData.forEach(item => {
      let card = document.createElement('div');
      card.className = 'kanban-card';
      card.onclick = () => window.location.href = `/groups/${item.id}`;
      card.innerHTML = `
        <div class="kanban-card-title">${item.name}</div>
        <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px;">${item.description.substring(0, 50)}${item.description.length > 50 ? '...' : ''}</div>
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary);">
            <span><i data-lucide="users" style="width:12px;height:12px; vertical-align:middle;"></i> ${item.member_count} Members</span>
            <span>Mgr: ${item.manager}</span>
        </div>
      `;
      board.appendChild(card);
    });
    lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', function() {
    loadFilterOptions();
    loadData();
  });
</script>
{% endblock %}
