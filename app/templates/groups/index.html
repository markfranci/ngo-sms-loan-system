{% extends 'base.html' %}
{% block title %}SME Groups{% endblock %}

{% block extra_css %}
<style>
  .odoo-control-panel {
    background-color: var(--card-bg);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    border-radius: var(--radius-lg);
  }
  .odoo-breadcrumb h2 { margin: 0; font-size: 1.25rem; font-weight: 500; display: inline-block; margin-right: 15px;}
  .odoo-search-container { position: relative; flex-grow: 1; max-width: 600px; margin: 0 20px; display: flex; }
  .odoo-search-bar { width: 100%; padding: 8px 15px 8px 35px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-primary); }
  .odoo-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
  .odoo-search-dropdown-btn { background: none; border: 1px solid var(--border-color); border-left: none; padding: 0 10px; cursor: pointer; border-radius: 0 4px 4px 0; color: var(--text-secondary); background-color: var(--bg-color); }
  .odoo-view-switchers { display: flex; gap: 5px; }
  .odoo-view-btn { background: none; border: 1px solid transparent; padding: 6px; cursor: pointer; color: var(--text-secondary); border-radius: 4px; }
  .odoo-view-btn.active { background-color: rgba(99, 102, 241, 0.1); color: #6366f1; border-color: rgba(99, 102, 241, 0.2); }
  .odoo-filter-panel { display: none; position: absolute; top: 100%; left: 0; width: 100%; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; z-index: 100; margin-top: 5px; }
  .odoo-filter-panel.open { display: block; }
  .filter-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
  .view-container { display: none; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; min-height: 400px; }
  .view-container.active { display: block; }
  .odoo-list-table { width: 100%; border-collapse: collapse; }
  .odoo-list-table th, .odoo-list-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
  .odoo-list-table th { font-weight: 500; color: var(--text-secondary); background-color: rgba(0,0,0,0.02); }
  .odoo-kanban { display: flex; flex-wrap: wrap; gap: 20px; padding-bottom: 10px; }
  .kanban-card { width: calc(33.333% - 15px); background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s;}
  .kanban-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .kanban-card-title { font-weight: 500; margin-bottom: 10px; color: var(--text-primary); text-decoration: none;}
  
  @media (max-width: 900px) {
      .kanban-card { width: calc(50% - 10px); }
  }
  @media (max-width: 600px) {
      .kanban-card { width: 100%; }
  }
</style>
{% endblock %}

{% block content %}
<div class="odoo-control-panel">
  <div class="odoo-breadcrumb">
    <h2>SME Groups</h2>
    {% if current_user.role == 'admin' %}
    <a href="{{ url_for('groups.create') }}" class="btn btn-sm btn-primary" style="margin-left:15px;">New Group</a>
    {% endif %}
  </div>

  <div class="odoo-search-container">
    <i data-lucide="search" class="odoo-search-icon" style="width: 16px; height: 16px;"></i>
    <input type="text" id="search-input" class="odoo-search-bar" placeholder="Search group name..." onkeyup="if(event.key === 'Enter') loadData()">
  </div>

  <div class="odoo-view-switchers">
    <button class="odoo-view-btn active" onclick="switchView('kanban')" id="btn-view-kanban" title="Kanban View">
      <i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i>
    </button>
    <button class="odoo-view-btn" onclick="switchView('list')" id="btn-view-list" title="List View">
      <i data-lucide="list" style="width: 18px; height: 18px;"></i>
    </button>
  </div>
</div>

<div id="view-kanban" class="view-container active">
  <div class="odoo-kanban" id="kanban-board"></div>
</div>

<div id="view-list" class="view-container">
  <div style="overflow-x: auto;">
    <table class="odoo-list-table">
      <thead id="list-thead"></thead>
      <tbody id="list-tbody"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let currentData = [];

  function switchView(viewName) {
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.odoo-view-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`view-${viewName}`).classList.add('active');
    document.getElementById(`btn-view-${viewName}`).classList.add('active');
    renderView(viewName);
  }

  function loadData() {
    const search = document.getElementById('search-input').value;
    
    let params = `entity=groups&search=${encodeURIComponent(search)}`;
    
    fetch(`{{ url_for('reports.get_report_data') }}?${params}`)
      .then(res => res.json())
      .then(data => {
        currentData = data;
        const activeView = document.querySelector('.view-container.active').id.replace('view-', '');
        renderView(activeView);
      })
      .catch(err => console.error(err));
  }

  function renderView(viewName) {
    if (viewName === 'list') renderList();
    else if (viewName === 'kanban') renderKanban();
  }

  function renderList() {
    const thead = document.getElementById('list-thead');
    const tbody = document.getElementById('list-tbody');
    thead.innerHTML = '<tr><th>Group Name</th><th>Description</th><th>Members</th><th>Manager</th><th>Created At</th><th>Actions</th></tr>';
    tbody.innerHTML = '';
    
    if (currentData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No groups found.</td></tr>';
      return;
    }

    currentData.forEach(row => {
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-primary">${row.name}</td>
        <td>${row.description}</td>
        <td><span class="badge badge-neutral">${row.member_count}</span></td>
        <td>${row.manager}</td>
        <td>${row.created_at}</td>
        <td><a href="/groups/${row.id}" class="btn btn-sm btn-outline-primary"><i data-lucide="eye" style="width:14px;height:14px;"></i> View</a></td>
      `;
      tbody.appendChild(tr);
    });
    lucide.createIcons();
  }

  function renderKanban() {
    const board = document.getElementById('kanban-board');
    board.innerHTML = '';
    
    if (currentData.length === 0) {
      board.innerHTML = '<p>No groups found.</p>';
      return;
    }

    currentData.forEach(item => {
      let card = document.createElement('div');
      card.className = 'kanban-card';
      card.onclick = () => window.location.href = `/groups/${item.id}`;
      card.innerHTML = `
        <div class="kanban-card-title">${item.name}</div>
        <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px;">${item.description.substring(0, 50)}${item.description.length > 50 ? '...' : ''}</div>
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary);">
            <span><i data-lucide="users" style="width:12px;height:12px; vertical-align:middle;"></i> ${item.member_count} Members</span>
            <span>Mgr: ${item.manager}</span>
        </div>
      `;
      board.appendChild(card);
    });
    lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
